<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ETF 每日持仓变化 · Dashboard v2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <iframe id="dashboard" src="./dashboard-v2.html" title="ETF 每日持仓变化 Dashboard v2"></iframe>
  <script>
    // 主页面每 5 分钟重新载入 Dashboard v2。Dashboard v2 每次加载都会
    // 使用 cache:no-store + 时间戳重新读取 GitHub 上最新的 status/trades JSON。
    const frame=document.getElementById('dashboard');
    setInterval(()=>{
      frame.src='./dashboard-v2.html?refresh='+Date.now();
    },300000);
  </script>
</body>
</html>
