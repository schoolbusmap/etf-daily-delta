name: ARK Official Holdings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ark_holdings.py"
      - ".github/workflows/ark_holdings.yml"
  schedule:
    # Start after the ARK Trading Desk email window and wait/retry for the official EOD CSVs.
    - cron: "20 20 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: ark-official-holdings
  cancel-in-progress: false

jobs:
  fetch-ark-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch official ARK Full Holdings CSVs
        id: ark
        continue-on-error: true
        run: >-
          python ark_holdings.py
          --wait-for-new
          --retries 5
          --retry-seconds 600
          --strict

      - name: Commit ARK holdings archive and derived deltas
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain data/ark output/ark_holdings_*)" ]]; then
            echo "No new ARK holdings data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ark output/ark_holdings_*
          git commit -m "chore(ark): archive official holdings $(TZ=America/New_York date +%F)"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected because main moved; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push ARK holdings data after 3 attempts."
          exit 1

      - name: Report ARK source failure
        if: steps.ark.outcome == 'failure'
        run: |
          echo "One or more official ARK holdings sources failed after retries."
          exit 1
