name: Daily ETF Holdings Delta

on:
  workflow_dispatch:
  schedule:
    # 08:07 America/New_York, Monday-Friday.
    - cron: "7 8 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: daily-etf-holdings-delta
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Chromium for dynamic holdings pages
        run: python -m playwright install --with-deps chromium

      - name: Fetch holdings and calculate deltas
        env:
          BROWSER_FALLBACK: "1"
          LOG_LEVEL: "INFO"
        run: python scraper.py --strict

      - name: Commit updated data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain data output)" ]]; then
            echo "No holdings/output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          git commit -m "chore(data): update ETF holdings $(TZ=America/New_York date +%F)"
          git push
