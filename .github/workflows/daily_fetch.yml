name: Daily ETF Holdings Delta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily_fetch.yml"
  schedule:
    # 08:07 America/New_York, Monday-Friday.
    # Validation trigger: 2026-08-28.
    - cron: "7 8 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: daily-etf-holdings-delta
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Chromium for dynamic holdings pages
        run: python -m playwright install --with-deps chromium

      - name: Fetch holdings and calculate deltas
        id: fetch
        continue-on-error: true
        env:
          BROWSER_FALLBACK: "1"
          LOG_LEVEL: "INFO"
        run: python scraper.py --strict

      - name: Commit updated data
        if: always()
        shell: bash
        env:
          BROWSER_FALLBACK: "1"
          LOG_LEVEL: "INFO"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          regenerate_on_latest_main() {
            echo "Remote main moved. Resetting to latest main and regenerating ETF data/output..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- data output

            # Keep the original behavior: commit any successful source updates even
            # if --strict reports that one or more other sources failed.
            set +e
            python scraper.py --strict
            retry_fetch_status=$?
            set -e
            if [[ ${retry_fetch_status} -ne 0 ]]; then
              echo "Regeneration completed with one or more source failures; successful updates will still be committed."
            fi
          }

          # The repository may have moved while the scraper was running. Avoid
          # creating a commit from a stale base because generated output files are
          # not safely mergeable/rebasable.
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            regenerate_on_latest_main
          fi

          for attempt in 1 2 3; do
            if [[ -z "$(git status --porcelain data output)" ]]; then
              echo "No holdings/output changes to commit."
              exit 0
            fi

            git add data output
            git commit -m "chore(data): update ETF holdings $(TZ=America/New_York date +%F)"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected because remote main moved."
            if [[ ${attempt} -lt 3 ]]; then
              regenerate_on_latest_main
            fi
          done

          echo "Unable to push updated ETF data after 3 attempts."
          exit 1

      - name: Report source failures
        if: steps.fetch.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more ETF sources failed, but successful data was committed."
          exit 1
