name: Daily ETF Holdings Delta

on:
  workflow_dispatch:
  schedule:
    # 08:07 America/New_York, Monday-Friday.
    - cron: "7 8 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: daily-etf-holdings-delta
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Chromium for dynamic holdings pages
        run: python -m playwright install --with-deps chromium

      - name: Fetch holdings and calculate deltas
        id: fetch
        continue-on-error: true
        env:
          BROWSER_FALLBACK: "1"
          LOG_LEVEL: "INFO"
        run: python scraper.py --strict

      - name: Commit updated data
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain data output)" ]]; then
            echo "No holdings/output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          git commit -m "chore(data): update ETF holdings $(TZ=America/New_York date +%F)"

          # main may move while the scraper is running (for example, a dashboard edit).
          # Rebase the generated data commit onto the newest remote main before pushing.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected because remote main moved; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push updated ETF data after 3 attempts."
          exit 1

      - name: Report source failures
        if: steps.fetch.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more ETF sources failed, but successful data was committed."
          exit 1
