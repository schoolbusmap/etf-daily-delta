name: ARK Signal Backtest

on:
  push:
    paths:
      - "ark_history_backfill.py"
      - "signal_backtest.py"
      - "tests/test_signal_backtest.py"
      - ".github/workflows/signal_backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ark-signal-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backtest unit tests
        run: python -m unittest discover -s tests -p "test_signal_backtest.py" -v

      - name: Backfill ARK historical signals
        run: python ark_history_backfill.py --start 2020-10-20

      - name: Smoke event study on feature branches
        if: github.ref != 'refs/heads/main'
        run: python signal_backtest.py --start 2021-01-01 --max-signals 50

      - name: Initial bounded validation on main
        if: github.ref == 'refs/heads/main'
        run: python signal_backtest.py --start 2020-10-20 --max-signals 200

      - name: Show research status
        run: |
          cat output/backtest_ark_historical_status.json
          cat output/backtest_status.json

      - name: Commit reproducible research outputs
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/backtest_ark_historical_signals.csv \
                  output/backtest_ark_historical_status.json \
                  output/signal_performance.csv \
                  output/backtest_summary_by_signal.csv \
                  output/backtest_summary_by_persistence.csv \
                  output/backtest_status.json
          if [[ -z "$(git status --porcelain -- output/backtest_* output/signal_performance.csv)" ]]; then
            echo "No backtest output changes to commit."
            exit 0
          fi
          git commit -m "chore(backtest): refresh ARK signal event study"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
